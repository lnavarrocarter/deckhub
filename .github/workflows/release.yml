name: release

# Al publicar una etiqueta vX.Y.Z se compila el plugin y se adjunta el zip
# instalable (Decky → Ajustes → Desarrollador → Instalar plugin desde ZIP).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python3 -m py_compile main.py $(find py_modules -name '*.py')
      - run: python3 scripts/build-zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeckHub
          path: out/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
